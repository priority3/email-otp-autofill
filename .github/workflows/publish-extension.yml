name: Publish extension to Chrome Web Store

# Publishes the extension whenever the version in chrome-extension/manifest.json
# changes on main. Any other change to the extension is a no-op: the version bump
# IS the release trigger, so shipping is one line in a normal PR.
#
# Required repository secret (Settings → Secrets and variables → Actions):
#   CWS_SERVICE_ACCOUNT_KEY   the full JSON key file of a Google Cloud service
#                             account, pasted verbatim
#
# Setup (https://developer.chrome.com/docs/webstore/service-accounts):
#   1. Enable the Chrome Web Store API in a Google Cloud project
#   2. Create a service account — it needs NO IAM roles
#   3. Create a JSON key for it and paste the file into the secret above
#   4. Add the service account's email under Account in the Developer Dashboard.
#      A publisher can currently have only ONE service account, so do not
#      replace an existing one without checking what else uses it.
#
# The publisher account must have 2-Step Verification enabled, or the API
# rejects updates to an existing item.
#
# Why a service account rather than the refresh-token flow the older docs
# describe: no six-month expiry to babysit, one secret instead of three, and
# the documented interactive flow still relies on the OOB redirect that Google
# has already discontinued.

on:
  push:
    branches: [main]
    paths:
      - "chrome-extension/manifest.json"
  workflow_dispatch:
    inputs:
      publish:
        description: "Submit for review after uploading (uncheck to leave it as a draft)"
        type: boolean
        default: true

# Never let two publishes race: the store keeps a single draft per item, so a
# second upload would clobber the first one mid-flight.
concurrency:
  group: cws-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Public information — it is in the Web Store URL. Not a secret.
  EXTENSION_ID: kidhdmkendlfkblailmonmpahjaljpai

jobs:
  publish:
    runs-on: ubuntu-latest
    # Forks have no credentials, and should not try to publish someone else's item.
    if: github.repository == 'priority3/email-otp-autofill'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need the previous commit to tell a version bump from any other edit.
          fetch-depth: 2

      - name: Detect version change
        id: version
        run: |
          set -euo pipefail
          MANIFEST=chrome-extension/manifest.json
          NEW=$(node -p "require('./$MANIFEST').version")

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — publishing $NEW regardless of history."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$NEW" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # git show fails on the very first commit; treat that as "new".
          if OLD_JSON=$(git show "HEAD^:$MANIFEST" 2>/dev/null); then
            OLD=$(printf '%s' "$OLD_JSON" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          else
            OLD=""
          fi

          echo "previous: ${OLD:-<none>}"
          echo "current : $NEW"
          if [ "$OLD" = "$NEW" ]; then
            echo "Version unchanged — nothing to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Check credentials are configured
        if: steps.version.outputs.changed == 'true'
        env:
          SA_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SA_KEY:-}" ]; then
            echo "::error::Missing repository secret CWS_SERVICE_ACCOUNT_KEY"
            exit 1
          fi
          # Fail here with a readable message rather than deep inside the signing
          # step — a truncated or wrong-format paste is the likely mistake.
          node -e '
            let key;
            try { key = JSON.parse(process.env.SA_KEY); }
            catch { console.log("::error::CWS_SERVICE_ACCOUNT_KEY is not valid JSON — paste the whole key file, including the braces."); process.exit(1); }
            for (const f of ["client_email", "private_key"]) {
              if (!key[f]) { console.log("::error::Service account key is missing the " + f + " field."); process.exit(1); }
            }
            console.log("service account: " + key.client_email);
          '

      # Cheap gate before shipping to users. There is no extension test suite, but
      # a syntax error or malformed manifest is exactly the class of mistake that
      # must not reach the store.
      - name: Validate package
        if: steps.version.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cd chrome-extension
          for f in *.js; do node --check "$f"; done
          node -e "
            const m = require('./manifest.json');
            if (!/^\d+(\.\d+){0,3}\$/.test(m.version)) throw new Error('bad version: ' + m.version);
            if (m.description.length > 132) throw new Error('description exceeds the store limit of 132 chars');
            for (const p of Object.values(m.icons)) require('fs').accessSync(p);
            for (const p of Object.values(m.action.default_icon)) require('fs').accessSync(p);
            console.log('manifest OK — version ' + m.version);
          "

      - name: Build package
        if: steps.version.outputs.changed == 'true'
        run: |
          set -euo pipefail
          rm -rf /tmp/ext && mkdir -p /tmp/ext
          cp -R chrome-extension/. /tmp/ext/

          # Strip manifest.key. It only exists to pin a stable extension ID when
          # loading unpacked; the store derives the published ID from its own key
          # and this repo's key does not match the published item. Leaving it in
          # is at best noise and at worst an upload rejection.
          node -e "
            const fs = require('fs');
            const p = '/tmp/ext/manifest.json';
            const m = JSON.parse(fs.readFileSync(p, 'utf8'));
            delete m.key;
            fs.writeFileSync(p, JSON.stringify(m, null, 2) + '\n');
            console.log('stripped manifest.key for the store package');
          "

          cd /tmp/ext
          zip -r "$GITHUB_WORKSPACE/extension.zip" . \
            -x "*.git*" -x "*node_modules*" -x "*dist*" -x "*.DS_Store"

          cd "$GITHUB_WORKSPACE"
          echo "--- package contents ---"
          unzip -l extension.zip
          # manifest.json must sit at the archive root or the store rejects it.
          unzip -l extension.zip | grep -qE ' manifest\.json$' \
            || { echo "::error::manifest.json is not at the zip root"; exit 1; }

      - name: Get access token
        if: steps.version.outputs.changed == 'true'
        id: token
        env:
          SA_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
        run: |
          set -euo pipefail

          # Sign a JWT locally, then trade it for an access token. Node only does
          # the crypto — the key never leaves this step, and never reaches argv
          # (which is world-readable in /proc).
          JWT=$(node -e '
            const crypto = require("crypto");
            const key = JSON.parse(process.env.SA_KEY);
            const enc = (o) => Buffer.from(JSON.stringify(o)).toString("base64url");
            const now = Math.floor(Date.now() / 1000);
            const body = enc({ alg: "RS256", typ: "JWT" }) + "." + enc({
              iss: key.client_email,
              scope: "https://www.googleapis.com/auth/chromewebstore",
              aud: "https://oauth2.googleapis.com/token",
              iat: now,
              exp: now + 3600,
            });
            const sig = crypto.createSign("RSA-SHA256").update(body).sign(key.private_key).toString("base64url");
            process.stdout.write(body + "." + sig);
          ')

          RESP=$(curl -sS -X POST https://oauth2.googleapis.com/token \
            -d "grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer" \
            --data-urlencode "assertion=$JWT")

          TOKEN=$(printf '%s' "$RESP" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).access_token || ''")
          if [ -z "$TOKEN" ]; then
            # Print only the error fields — never the whole body.
            printf '%s' "$RESP" | node -p "
              const d = JSON.parse(require('fs').readFileSync(0,'utf8'));
              'error: ' + (d.error || '?') + ' — ' + (d.error_description || '')
            "
            echo "::error::Could not get an access token. invalid_grant usually means the service account has not been added under Account in the Developer Dashboard, or the Chrome Web Store API is not enabled on its Cloud project."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Upload package
        if: steps.version.outputs.changed == 'true'
        env:
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          RESP=$(curl -sS -X PUT \
            -H "Authorization: Bearer $TOKEN" \
            -H "x-goog-api-version: 2" \
            -T extension.zip \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$EXTENSION_ID")
          echo "$RESP"

          STATE=$(printf '%s' "$RESP" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).uploadState || 'UNKNOWN'")
          if [ "$STATE" != "SUCCESS" ]; then
            printf '%s' "$RESP" | node -p "
              const d = JSON.parse(require('fs').readFileSync(0,'utf8'));
              (d.itemError || []).map(e => e.error_code + ': ' + e.error_detail).join('\n') || 'no itemError detail'
            "
            echo "::error::Upload failed with uploadState=$STATE"
            exit 1
          fi
          echo "Uploaded version ${{ steps.version.outputs.version }} as a draft."

      - name: Submit for review
        if: steps.version.outputs.changed == 'true' && (github.event_name == 'push' || inputs.publish)
        env:
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          RESP=$(curl -sS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$EXTENSION_ID/publish")
          echo "$RESP"

          # ITEM_PENDING_REVIEW is the normal outcome for an update — it means the
          # submission was accepted and is queued, NOT that something went wrong.
          printf '%s' "$RESP" | node -e "
            const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const status = d.status || [];
            const detail = (d.statusDetail || []).join(' | ');
            const ok = ['OK', 'ITEM_PENDING_REVIEW'];
            console.log('status: ' + status.join(', ') + (detail ? ' — ' + detail : ''));
            if (!status.length || !status.every(s => ok.includes(s))) {
              console.log('::error::Publish rejected: ' + status.join(', ') + ' — ' + detail);
              process.exit(1);
            }
          "

      - name: Summary
        if: always() && steps.version.outputs.changed == 'true'
        run: |
          {
            echo "### Chrome Web Store"
            echo ""
            echo "- version: \`${{ steps.version.outputs.version }}\`"
            echo "- item: [\`$EXTENSION_ID\`](https://chrome.google.com/webstore/devconsole/)"
            echo "- review usually takes a few hours to a few days; the store emails the outcome"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the built package
        if: steps.version.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ steps.version.outputs.version }}
          path: extension.zip
